<style>:root{--fg:#1a1a1a;--muted:#5f6670;--bg:#ffffff;--line:#e3e6ea;--brand:#1B6BE3;--note:#fff8e1;--note-line:#f1d27a}
@media (prefers-color-scheme:dark){:root{--fg:#e8eaed;--muted:#a3a9b1;--bg:#15171a;--line:#2c3036;--brand:#6ea2ff;--note:#2b2716;--note-line:#6b5b25}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Noto Sans JP","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
header{border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:16px}
.app{color:var(--muted);font-size:14px;margin:0 0 4px}
h1{font-size:24px;line-height:1.35;margin:0}
p{margin:0 0 16px}
a{color:var(--brand)}
ul{padding-left:20px}
li{margin:8px 0}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;color:var(--muted);font-size:14px}
.note{background:var(--note);border:1px solid var(--note-line);border-radius:8px;padding:12px 16px;margin:0 0 24px}</style>
